plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

def (mcVersion, loader) = stonecutter.current.project.split('-', 2)
def isFabric = loader == 'fabric'
def javaVersion = project.property('java_version') as int

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${loader}-${mcVersion}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
}

stonecutter {
    constants.match(loader, 'fabric', 'neoforge')
}

if (isFabric) {
    apply plugin: 'dev.kikugie.loom-back-compat'

    loom {
        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"
        loomx.applyMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.property('deps.fabric_loader')}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('deps.fabric_api')}"
    }
} else {
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        version = project.neo_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        runs {
            client {
                client()
            }
            server {
                server()
                programArgument '--nogui'
            }
            data {
                clientData()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }
            configureEach {
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
            }
        }
    }
}

def expandProps = [
    minecraft_version_range: project.minecraft_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    debug_overlay_mixin    : mcVersion == '1.21.1' ? ',\n    "DebugScreenOverlayAccessor"' : '',
]

if (isFabric) {
    expandProps += [
        fabric_loader_version_range: project.fabric_loader_version_range,
        java_version_range         : ">=${javaVersion}",
    ]
} else {
    expandProps += [
        neo_version_range   : project.neo_version_range,
        loader_version_range: project.loader_version_range,
    ]
}

processResources {
    def props = expandProps
    inputs.properties props
    if (isFabric) {
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        exclude 'fabric.mod.json'
    }
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand props
    }
    filesMatching('modern_f3.mixins.json') {
        expand props
    }
}

if (loader == 'neoforge' && mcVersion == '26.1.2') {
    def prismModsDir = file('C:/Users/Kanishq/AppData/Roaming/PrismLauncher/instances/26.1/minecraft/mods')
    def copyjar = tasks.register('copyjar', Copy) {
        dependsOn tasks.named('jar')
        from(tasks.named('jar').flatMap { it.archiveFile })
        into prismModsDir
    }
    tasks.named('build') {
        finalizedBy copyjar
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
