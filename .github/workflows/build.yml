name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 26.1.2-fabric
          - 26.1.2-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build target
        run: ./gradlew :${{ matrix.target }}:build -x copyjar --console=plain

      - name: Verify artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          import struct
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          jars = [path for path in Path("versions", target, "build", "libs").glob("*.jar") if "sources" not in path.name]
          if len(jars) != 1:
              raise SystemExit(f"Expected one release jar for {target}, found {len(jars)}")

          with zipfile.ZipFile(jars[0]) as artifact:
              names = set(artifact.namelist())
              fabric = "fabric.mod.json" in names
              neoforge = "META-INF/neoforge.mods.toml" in names
              if fabric == neoforge or fabric != target.endswith("-fabric"):
                  raise SystemExit(f"Incorrect loader metadata in {jars[0]}")

              descriptor = "fabric.mod.json" if fabric else "META-INF/neoforge.mods.toml"
              if b"${" in artifact.read(descriptor):
                  raise SystemExit(f"Unexpanded metadata in {jars[0]}")

              class_bytes = artifact.read("me/almana/modern_f3/ModernF3.class")
              major = struct.unpack(">H", class_bytes[6:8])[0]
              expected = 65 if target.startswith("1.21.1-") else 69
              if major != expected:
                  raise SystemExit(f"Expected class version {expected}, found {major}")
          PY
