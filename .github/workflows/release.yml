name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish_discord:
        description: Send Discord notification
        required: true
        type: boolean
        default: true
      publish_github:
        description: Publish to GitHub Releases
        required: true
        type: boolean
        default: true
      publish_curseforge:
        description: Publish to CurseForge
        required: true
        type: boolean
        default: true
      publish_modrinth:
        description: Publish to Modrinth
        required: true
        type: boolean
        default: true
      confirm:
        description: Type RELEASE to confirm
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      mod_name: ${{ steps.metadata.outputs.mod_name }}
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      java_version: ${{ steps.metadata.outputs.java_version }}
      release_tags: ${{ steps.targets.outputs.release_tags }}
      publish_discord: ${{ steps.inputs.outputs.publish_discord }}
      publish_github: ${{ steps.inputs.outputs.publish_github }}
      publish_curseforge: ${{ steps.inputs.outputs.publish_curseforge }}
      publish_modrinth: ${{ steps.inputs.outputs.publish_modrinth }}
    steps:
      - name: Check confirmation
        id: inputs
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          PUBLISH_DISCORD: ${{ inputs.publish_discord }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
          PUBLISH_MODRINTH: ${{ inputs.publish_modrinth }}
        run: |
          if [[ "$CONFIRM" != "RELEASE" ]]; then
            echo "Manual confirmation failed. Type RELEASE in the confirm input."
            exit 1
          fi

          echo "publish_discord=$PUBLISH_DISCORD" >> "$GITHUB_OUTPUT"
          echo "publish_github=$PUBLISH_GITHUB" >> "$GITHUB_OUTPUT"
          echo "publish_curseforge=$PUBLISH_CURSEFORGE" >> "$GITHUB_OUTPUT"
          echo "publish_modrinth=$PUBLISH_MODRINTH" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project metadata
        id: metadata
        shell: bash
        run: |
          mod_name="$(awk -F= '/^mod_name=/{print $2}' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '/^mod_version=/{print $2}' gradle.properties | tr -d '\r')"
          java_version="$(grep -roE 'JavaLanguageVersion\.of\([0-9]+\)' build.gradle build.gradle.kts 2>/dev/null | head -n1 | grep -oE '[0-9]+' || true)"

          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "java_version=${java_version:-21}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.metadata.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Discover Stonecutter targets
        id: targets
        shell: bash
        env:
          MOD_VERSION: ${{ steps.metadata.outputs.mod_version }}
        run: |
          projects="$(./gradlew -Dorg.gradle.java.home="$JAVA_HOME" projects --console=plain -q 2>&1)"
          matrix="$(python3 -c '
          import json
          import os
          import re
          import sys
          from collections import defaultdict
          from pathlib import Path

          targets = defaultdict(list)
          for name in set(re.findall(r"Project \x27:([^\x27]+)\x27", sys.stdin.read())):
              match = re.fullmatch(r"(\d+(?:\.\d+)+)-([a-z0-9]+)", name)
              if match:
                  targets[match.group(1)].append((name, match.group(2)))

          if not targets:
              raise SystemExit("No Stonecutter version projects were found.")

          mod_version = os.environ["MOD_VERSION"]
          releases = []
          for minecraft_version, projects in sorted(targets.items()):
              projects.sort()
              release_version = minecraft_version.rsplit(".", 1)[0] if minecraft_version.count(".") > 1 else minecraft_version
              preferred_changelog = Path(f"CHANGELOGS/{release_version}-{mod_version}.md")
              changelogs = sorted(Path("CHANGELOGS").glob(f"*-{mod_version}.md"))
              if preferred_changelog.exists():
                  changelog = preferred_changelog
              elif len(changelogs) == 1:
                  changelog = changelogs[0]
              else:
                  raise SystemExit(f"Missing changelog for Minecraft {minecraft_version}. Add {preferred_changelog} or one shared *-{mod_version}.md file.")

              releases.append({
                  "minecraft_version": minecraft_version,
                  "release_tag": f"{minecraft_version}-{mod_version}",
                  "build_tasks": " ".join(f":{project}:build" for project, _ in projects),
                  "loaders": "\\n".join(loader for _, loader in projects),
                  "changelog_file": str(changelog),
              })

          print(json.dumps({"include": releases}, separators=(",", ":")))
          ' <<< "$projects")"

          release_tags="$(python3 -c 'import json, sys; print(", ".join(item["release_tag"] for item in json.load(sys.stdin)["include"]))' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "release_tags=$release_tags" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.minecraft_version }}
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare-release.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build configured targets
        shell: bash
        env:
          BUILD_TASKS: ${{ matrix.build_tasks }}
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" $BUILD_TASKS -x copyjar --console=plain

      - name: Publish release
        id: publish
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: ${{ needs.prepare-release.outputs.mod_name }} - ${{ matrix.release_tag }}
          version: ${{ matrix.release_tag }}
          files: versions/${{ matrix.minecraft_version }}-*/build/libs/*.jar
          changelog-file: ${{ matrix.changelog_file }}
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ matrix.minecraft_version }}
          game-version-filter: none
          java: ${{ needs.prepare-release.outputs.java_version }}
          github-token: ${{ needs.prepare-release.outputs.publish_github == 'true' && secrets.GITHUB_TOKEN || '' }}
          github-tag: ${{ matrix.release_tag }}
          github-commitish: ${{ github.sha }}
          modrinth-id: ${{ needs.prepare-release.outputs.publish_modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ needs.prepare-release.outputs.publish_modrinth == 'true' && secrets.TOKEN_MODRINTH || '' }}
          curseforge-id: ${{ needs.prepare-release.outputs.publish_curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ needs.prepare-release.outputs.publish_curseforge == 'true' && secrets.TOKEN_CURSEFORGE || '' }}

  notify-discord:
    name: Notify Discord
    needs: [prepare-release, release]
    if: always() && needs.prepare-release.outputs.publish_discord == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
      MOD_NAME: ${{ needs.prepare-release.outputs.mod_name }}
      RELEASE_TAGS: ${{ needs.prepare-release.outputs.release_tags }}
      RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
    steps:
      - name: Send Discord notification
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            exit 0
          fi

          payload="$(python3 -c 'import json, os
          role_id = os.environ["DISCORD_ROLE_ID"].strip()
          greeting = f"Hey <@&{role_id}>" if role_id else "Hey"
          content = "\n".join([greeting, "", "New {} release: {}".format(os.environ["MOD_NAME"], os.environ["RELEASE_TAGS"]), os.environ["RELEASES_URL"]])
          print(json.dumps({"content": content, **({"allowed_mentions": {"parse": [], "roles": [role_id]}} if role_id else {})}))')"

          curl --fail --silent --show-error -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
