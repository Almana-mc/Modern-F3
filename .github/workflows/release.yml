name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish_discord:
        description: Send Discord notification
        required: true
        type: boolean
        default: true
      publish_github:
        description: Publish to GitHub Releases
        required: true
        type: boolean
        default: true
      publish_curseforge:
        description: Publish to CurseForge
        required: true
        type: boolean
        default: true
      publish_modrinth:
        description: Publish to Modrinth
        required: true
        type: boolean
        default: true
      confirm:
        description: Type RELEASE to confirm
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      curseforge_matrix: ${{ steps.targets.outputs.curseforge_matrix }}
      mod_id: ${{ steps.metadata.outputs.mod_id }}
      mod_name: ${{ steps.metadata.outputs.mod_name }}
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      build_java: ${{ steps.metadata.outputs.build_java }}
      release_tags: ${{ steps.targets.outputs.release_tags }}
      publish_discord: ${{ steps.inputs.outputs.publish_discord }}
      publish_github: ${{ steps.inputs.outputs.publish_github }}
      publish_curseforge: ${{ steps.inputs.outputs.publish_curseforge }}
      publish_modrinth: ${{ steps.inputs.outputs.publish_modrinth }}
    steps:
      - name: Check confirmation
        id: inputs
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          PUBLISH_DISCORD: ${{ inputs.publish_discord }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
          PUBLISH_MODRINTH: ${{ inputs.publish_modrinth }}
        run: |
          if [[ "$CONFIRM" != "RELEASE" ]]; then
            echo "Manual confirmation failed. Type RELEASE in the confirm input."
            exit 1
          fi

          echo "publish_discord=$PUBLISH_DISCORD" >> "$GITHUB_OUTPUT"
          echo "publish_github=$PUBLISH_GITHUB" >> "$GITHUB_OUTPUT"
          echo "publish_curseforge=$PUBLISH_CURSEFORGE" >> "$GITHUB_OUTPUT"
          echo "publish_modrinth=$PUBLISH_MODRINTH" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project metadata
        id: metadata
        shell: bash
        run: |
          mod_id="$(awk -F= '/^mod_id=/{print $2}' gradle.properties | tr -d '\r')"
          mod_name="$(awk -F= '/^mod_name=/{print $2}' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '/^mod_version=/{print $2}' gradle.properties | tr -d '\r')"
          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"
          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "build_java=25" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.metadata.outputs.build_java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Discover Stonecutter targets
        id: targets
        shell: bash
        env:
          MOD_VERSION: ${{ steps.metadata.outputs.mod_version }}
        run: |
          projects="$(./gradlew -Dorg.gradle.java.home="$JAVA_HOME" projects --console=plain -q 2>&1)"
          python3 -c '
          import json
          import os
          import re
          import sys
          from collections import defaultdict
          from pathlib import Path

          targets = defaultdict(list)
          for name in set(re.findall(r"Project \x27:([^\x27]+)\x27", sys.stdin.read())):
              match = re.fullmatch(r"(.+)-([a-z0-9]+)", name)
              if match:
                  targets[match.group(1)].append((name, match.group(2)))

          if not targets:
              raise SystemExit("No Stonecutter version projects were found.")

          mod_version = os.environ["MOD_VERSION"]
          changelog = Path(f"CHANGELOGS/{mod_version}.md")
          if not changelog.is_file():
              raise SystemExit(f"Missing shared changelog: {changelog}")

          releases = []
          curseforge_releases = []
          for minecraft_version, projects in sorted(targets.items()):
              projects.sort()
              java_versions = {
                  re.search(r"^java_version=(\d+)$", Path("versions", project, "gradle.properties").read_text(), re.MULTILINE).group(1)
                  for project, _ in projects
              }
              if len(java_versions) != 1:
                  raise SystemExit(f"Inconsistent Java versions for Minecraft {minecraft_version}: {sorted(java_versions)}")

              java_version = java_versions.pop()
              loaders = [loader for _, loader in projects]
              release_tag = f"{minecraft_version}-{mod_version}"
              releases.append({
                  "minecraft_version": minecraft_version,
                  "release_tag": release_tag,
                  "build_tasks": " ".join(f":{project}:build" for project, _ in projects),
                  "loaders": "\n".join(loaders),
                  "changelog_file": str(changelog),
                  "java_version": java_version,
              })
              curseforge_releases.extend({
                  "minecraft_version": minecraft_version,
                  "release_tag": release_tag,
                  "loader": loader,
                  "changelog_file": str(changelog),
                  "java_version": java_version,
              } for loader in loaders)

          print("matrix=" + json.dumps({"include": releases}, separators=(",", ":")))
          print("curseforge_matrix=" + json.dumps({"include": curseforge_releases}, separators=(",", ":")))
          print("release_tags=" + ", ".join(item["release_tag"] for item in releases))
          ' <<< "$projects" >> "$GITHUB_OUTPUT"

  build-releases:
    name: Build ${{ matrix.minecraft_version }}
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare-release.outputs.build_java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build configured targets
        shell: bash
        env:
          BUILD_TASKS: ${{ matrix.build_tasks }}
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" $BUILD_TASKS -x copyjar --console=plain

      - name: Stage release artifacts
        shell: bash
        env:
          LOADERS: ${{ matrix.loaders }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
          MOD_ID: ${{ needs.prepare-release.outputs.mod_id }}
          MOD_VERSION: ${{ needs.prepare-release.outputs.mod_version }}
        run: |
          mkdir release-files
          for loader in $LOADERS; do
            artifact="versions/$MINECRAFT_VERSION-$loader/build/libs/$MOD_ID-$loader-$MINECRAFT_VERSION-$MOD_VERSION.jar"
            if [[ ! -f "$artifact" ]]; then
              echo "Missing release artifact: $artifact"
              exit 1
            fi
            cp "$artifact" release-files/
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.minecraft_version }}
          path: release-files/*.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release ${{ matrix.minecraft_version }}
    needs: [prepare-release, build-releases]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.minecraft_version }}
          path: release-files

      - name: Publish GitHub and Modrinth
        id: publish
        if: needs.prepare-release.outputs.publish_github == 'true' || needs.prepare-release.outputs.publish_modrinth == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ needs.prepare-release.outputs.mod_name }} - ${{ matrix.release_tag }}
          version: ${{ matrix.release_tag }}
          files: release-files/*.jar
          changelog-file: ${{ matrix.changelog_file }}
          loaders: ${{ matrix.loaders }}
          environment: client
          game-versions: ${{ matrix.minecraft_version }}
          game-version-filter: none
          java: ${{ matrix.java_version }}
          github-token: ${{ needs.prepare-release.outputs.publish_github == 'true' && secrets.GITHUB_TOKEN || '' }}
          github-tag: ${{ matrix.release_tag }}
          github-commitish: ${{ github.sha }}
          modrinth-id: ${{ needs.prepare-release.outputs.publish_modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ needs.prepare-release.outputs.publish_modrinth == 'true' && secrets.TOKEN_MODRINTH || '' }}

  release-curseforge:
    name: Release ${{ matrix.minecraft_version }} ${{ matrix.loader }} to CurseForge
    needs: [prepare-release, build-releases]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare-release.outputs.curseforge_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.minecraft_version }}
          path: release-files

      - name: Publish CurseForge file
        if: needs.prepare-release.outputs.publish_curseforge == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          name: ${{ needs.prepare-release.outputs.mod_name }} - ${{ matrix.release_tag }}
          version: ${{ matrix.release_tag }}
          files: release-files/${{ needs.prepare-release.outputs.mod_id }}-${{ matrix.loader }}-${{ matrix.minecraft_version }}-${{ needs.prepare-release.outputs.mod_version }}.jar
          changelog-file: ${{ matrix.changelog_file }}
          loaders: ${{ matrix.loader }}
          environment: client
          game-versions: ${{ matrix.minecraft_version }}
          game-version-filter: none
          java: ${{ matrix.java_version }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.TOKEN_CURSEFORGE }}

  notify-discord:
    name: Notify Discord
    needs: [prepare-release, release, release-curseforge]
    if: always() && needs.prepare-release.outputs.publish_discord == 'true' && needs.release.result == 'success' && needs.release-curseforge.result == 'success'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
      MOD_NAME: ${{ needs.prepare-release.outputs.mod_name }}
      RELEASE_TAGS: ${{ needs.prepare-release.outputs.release_tags }}
      RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
    steps:
      - name: Send Discord notification
        shell: bash
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            exit 0
          fi

          payload="$(python3 -c 'import json, os
          role_id = os.environ["DISCORD_ROLE_ID"].strip()
          greeting = f"Hey <@&{role_id}>" if role_id else "Hey"
          content = "\n".join([greeting, "", "New {} release: {}".format(os.environ["MOD_NAME"], os.environ["RELEASE_TAGS"]), os.environ["RELEASES_URL"]])
          print(json.dumps({"content": content, **({"allowed_mentions": {"parse": [], "roles": [role_id]}} if role_id else {})}))')"

          curl --fail --silent --show-error -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
